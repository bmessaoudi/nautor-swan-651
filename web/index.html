<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nautor Swan - Archivio storico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/intro.css" />
</head>
<body>
  <header class="site-header">
    <span class="site-logo" role="img" aria-label="Nautor Swan"></span>
  </header>

  <main>
    <!-- Ingresso: il frontespizio dell'archivio, sopra il video dell'unica barca in schedario. -->
    <section class="hero">
      <video
        class="hero-video"
        src="/intro/hero-video.mp4"
        poster="/intro/hero-background.png"
        muted
        playsinline
        preload="auto"
        aria-hidden="true"
      ></video>
      <canvas class="hero-ripple" aria-hidden="true"></canvas>
      <div class="hero-shade"></div>
      <div class="hero-gradient"></div>

      <div class="hero-content container">
        <p class="reveal eyebrow">Archivio storico · Nautor Swan</p>
        <h1 class="reveal" style="--delay: 0.08s">L'archivio storico Nautor Swan</h1>
        <p class="reveal hero-intro" style="--delay: 0.16s">Entra nel profondo del mondo Nautor Swan: un archivio storico che custodisce documenti, immagini e testimonianze, da esplorare una pagina alla volta.</p>
        <div class="reveal hero-cta" style="--delay: 0.24s">
          <a class="cta cta-shine" href="/modello.html">Scopri la barca</a>
        </div>
      </div>
    </section>
  </main>

  <div class="page-fade" aria-hidden="true"></div>

  <script type="module" src="/src/intro.js"></script>
</body>
</html>
