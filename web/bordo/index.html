<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swan 651, computer di bordo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Arrivando dalla landing la pagina parte già navy, come la copertura che si è appena chiusa:
       lo stile vero arriva con pagina.js, che poi fa comparire il contenuto con una sfumatura -->
  <style>
    html { background: #003660; }
    /* html body: più specifico di body in pagina.css, che ha già la sua transizione del colore */
    html body { margin: 0; opacity: 0; transition: opacity 0.8s ease, color 0.6s ease; }
    html body.visibile { opacity: 1; }
  </style>
</head>
<body data-fase="ingresso">
  <canvas id="gl"></canvas>
  <div id="hotspots"></div>

  <!-- Parole chiave e dati: li sceglie l'agente mentre parla -->
  <div id="parole" aria-live="polite" data-tone>
    <h2 class="parole-titolo"></h2>
    <dl class="parole-dati"></dl>
  </div>

  <!-- Foto e grafici richiamati dall'agente -->
  <figure id="media" aria-live="polite">
    <div class="media-corpo"></div>
    <figcaption><span class="media-titolo"></span><span class="media-didascalia mono"></span></figcaption>
  </figure>

  <!-- Indietro: sempre visibile, anche al buio dell'ingresso; riporta alla scelta della visita -->
  <a id="indietro" href="/?scelta" aria-label="Torna alla scelta della visita">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
    <span>Scegli la visita</span>
  </a>

  <header id="top">
    <a class="brand" href="/" aria-label="Nautor Swan, torna all'inizio"></a>
  </header>

  <!-- Indice: gli argomenti della visita, da toccare o da chiedere a voce -->
  <nav id="indice" aria-label="Argomenti della visita">
    <span class="mono indice-titolo">Esplora la barca</span>
    <p class="indice-nota">Tocca un argomento o chiedimelo a voce.</p>
    <div class="indice-voci"></div>
  </nav>

  <!-- Ingresso: tutto spento, si accende dal pulsante di vetro -->
  <section id="ingresso">
    <p class="invito">Tocca il pulsante di <b>accensione</b> per svegliare il computer di bordo.</p>
  </section>
  <section id="ingresso-sotto">
    <p class="mono nota"><span class="carico">Caricamento della barca <b class="pct">0%</b></span><span class="pronto">Ti servirà il microfono. Puoi interrompermi quando vuoi.</span></p>
  </section>

  <div id="plancia" data-state="off"></div>
  <p id="cc" aria-live="off"></p>

  <script type="module" src="/src/bordo/pagina.js"></script>
</body>
</html>
